{% extends "base.html" %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-20 bg-slate-50 relative overflow-hidden">
    <!-- Decorative background -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-purple-100 rounded-full blur-[100px] opacity-60"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-100 rounded-full blur-[100px] opacity-60"></div>

    <div class="max-w-md w-full mx-auto relative z-10 p-4">
        <div class="glass p-10 rounded-3xl shadow-2xl border border-white/50">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-6 shadow-lg -rotate-3">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2 italic">Welcome Back</h2>
                <p class="text-gray-500 italic">Continue your journey to the perfect career</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div id="errorMsg" class="hidden bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl text-sm text-center"></div>
                
                <div class="space-y-1">
                    <label class="text-sm font-bold text-gray-700 italic ml-1">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="email" required placeholder="name@example.com" 
                            class="w-full pl-12 pr-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                </div>
                
                <div class="space-y-1">
                    <label class="text-sm font-bold text-gray-700 italic ml-1">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" required placeholder="••••••••" 
                            class="w-full pl-12 pr-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full btn-primary py-4 text-lg mt-4 group">
                    Account Access
                    <i class="fas fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center my-6">
                <div class="flex-1 border-t border-gray-200"></div>
                <span class="px-4 text-sm text-gray-400 font-medium">or</span>
                <div class="flex-1 border-t border-gray-200"></div>
            </div>

            <!-- Google Sign-In Button -->
            <button id="googleSignInBtn" onclick="signInWithGoogle('errorMsg')" type="button"
                class="w-full flex items-center justify-center gap-3 px-6 py-3.5 bg-white border-2 border-gray-200 rounded-xl font-semibold text-gray-700 hover:bg-gray-50 hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <div class="mt-8 pt-8 border-t border-gray-100 text-center">
                <p class="text-gray-500 italic">
                    New to the platform? 
                    <a href="/register" class="text-indigo-600 font-bold hover:underline ml-1">Create Account</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (getUser()) {
            if (getUser().profileComplete) {
                window.location.href = '/dashboard';
            } else {
                window.location.href = '/onboarding';
            }
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = e.target.querySelector('button[type="submit"]');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
        errorMsg.classList.add('hidden');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if (data.user.profileComplete) {
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/onboarding';
                }
            } else {
                errorMsg.textContent = data.message || 'Verification failed';
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            errorMsg.textContent = 'Connectivity error. Check your network.';
            errorMsg.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Account Access <i class="fas fa-arrow-right ml-2"></i>';
        }
    });
</script>
{% endblock %}
