<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='favicon.jpg') }}">
    <title>{% block title %}EduPath - AI Career Intelligence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--dark);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.5);
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
    <script>
        // API Helper for authenticated requests
        async function apiFetch(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(endpoint, {
                ...options,
                headers
            });

            if (response.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
                return null;
            }

            return response.json();
        }

        function getUser() {
            const userStr = localStorage.getItem('user');
            return userStr ? JSON.parse(userStr) : null;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = getUser();
            const authLinks = document.getElementById('auth-links');
            if (user && authLinks) {
                authLinks.innerHTML = `
                    <span class="text-gray-700 mr-4 font-semibold">Hello, ${user.name}</span>
                    <a href="/dashboard" class="text-gray-700 hover:text-indigo-600 font-medium mr-4">Dashboard</a>
                    <a href="/onboarding" class="text-gray-700 hover:text-indigo-600 font-medium mr-4">Edit Profile</a>
                    <a href="/history" class="text-gray-700 hover:text-indigo-600 font-medium mr-4">History</a>
                    <button onclick="logout()" class="btn-secondary text-sm">Logout</button>
                `;
            }
        });

        // ── Firebase Google Sign-In ──────────────────────────────────
        let _firebaseReady = false;
        (async function initFirebase() {
            try {
                const res = await fetch('/api/firebase-config');
                const firebaseConfig = await res.json();
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                _firebaseReady = true;
            } catch (e) {
                console.warn('Firebase config not loaded:', e);
            }
        })();

        async function signInWithGoogle(errorMsgId) {
            const errorMsg = document.getElementById(errorMsgId || 'errorMsg');
            const googleBtn = document.getElementById('googleSignInBtn');
            
            if (googleBtn) {
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Connecting...';
            }
            if (errorMsg) errorMsg.classList.add('hidden');

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await firebase.auth().signInWithPopup(provider);
                const idToken = await result.user.getIdToken();

                // Send token to our backend
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (data.user.profileComplete) {
                        window.location.href = '/dashboard';
                    } else {
                        window.location.href = '/onboarding';
                    }
                } else {
                    if (errorMsg) {
                        errorMsg.textContent = data.message || 'Google sign-in failed';
                        errorMsg.classList.remove('hidden');
                    }
                }
            } catch (err) {
                console.error('Google Sign-In error:', err);
                if (err.code !== 'auth/popup-closed-by-user' && errorMsg) {
                    errorMsg.textContent = 'Google sign-in failed. Please try again.';
                    errorMsg.classList.remove('hidden');
                }
            } finally {
                if (googleBtn) {
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = '<svg class="w-5 h-5 mr-3" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google';
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 border-b border-indigo-100/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="/" class="flex items-center group">
                    <div
                        class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white mr-3 shadow-lg group-hover:rotate-6 transition-transform">
                        <i class="fas fa-graduation-cap text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold text-gray-900 tracking-tight">EduPath<span
                            class="text-indigo-600">.</span></span>
                </a>
                <div id="auth-links" class="flex items-center gap-6">
                    <a href="/login"
                        class="text-gray-600 hover:text-indigo-600 font-semibold transition-colors">Access Account</a>
                    <a href="/register" class="btn-primary">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-400">
            <p>&copy; 2026 EduPath. Shaping the future of careers with Generative AI <i
                    class="fas fa-rocket text-indigo-400 ml-1"></i></p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>

</html>
