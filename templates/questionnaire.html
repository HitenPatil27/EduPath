{% extends "base.html" %}

{% block content %}
<section class="py-12 fade-in">
    <div class="max-w-2xl mx-auto px-4">
        <!-- AI Shimmer / Loader state initially hidden -->
        <div id="loaderState" class="hidden text-center py-20">
            <div class="inline-block p-4 rounded-full bg-indigo-50 mb-6 relative">
                <i class="fas fa-robot text-4xl text-indigo-600 relative z-10"></i>
                <div class="absolute inset-0 border-4 border-indigo-200 rounded-full animate-ping opacity-75"></div>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2 shimmer text-transparent bg-clip-text">Tailoring your next question...</h2>
            <p class="text-gray-500">Analyzing your profile to find the perfect path.</p>
        </div>

        <div id="questionState" class="glass rounded-3xl p-10 shadow-xl border border-white/50 hidden relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/5 rounded-full blur-2xl"></div>

            <div class="flex items-center text-indigo-600 mb-6">
                <i class="fas fa-robot text-2xl mr-3"></i>
                <span class="font-bold">Career Assessment</span>
            </div>
            
            <h2 id="questionText" class="text-2xl font-bold text-gray-900 mb-2">Question text</h2>
            <p id="questionContext" class="text-sm text-gray-500 mb-8 italic">Context...</p>

            <form id="questionForm">
                <div id="inputContainer" class="space-y-4 mb-8">
                    <!-- Populated by JS -->
                </div>
                
                <div class="flex justify-between items-center text-sm text-gray-500">
                    <span id="questionCounter">Question 1</span>
                    <div class="flex gap-4">
                        <button type="button" id="prevBtn" onclick="goPrevious()" class="hidden text-gray-500 hover:text-indigo-600 font-medium px-4 py-2 rounded-lg transition-colors">
                            <i class="fas fa-arrow-left mr-2"></i> Previous
                        </button>
                        <button type="submit" id="submitBtn" class="btn-primary">
                            Submit Answer <i class="fas fa-paper-plane ml-2"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    let currentSessionId = null;
    let questionCount = 0;
    let questionHistory = []; // Array to store past question payloads
    let currentQuestionData = null;
    
    window.addEventListener('DOMContentLoaded', async () => {
        if (!getUser()) window.location.href = '/';
        startSession();
    });

    function showLoader() {
        document.getElementById('questionState').classList.add('hidden');
        document.getElementById('loaderState').classList.remove('hidden');
    }

    function hideLoader() {
        document.getElementById('loaderState').classList.add('hidden');
        document.getElementById('questionState').classList.remove('hidden');
    }

    async function startSession() {
        showLoader();
        const res = await apiFetch('/api/session/start', { method: 'POST' });
        if (res) {
            handleGroqResponse(res);
        }
    }

    async function submitAnswer(e) {
        e.preventDefault();
        
        let answerVal = null;
        const type = currentQuestionData.type;
        
        if (type === 'single-select') {
            const checked = document.querySelector('input[name="answer"]:checked');
            const otherVal = document.getElementById('otherAns')?.value.trim();
            if (!checked && !otherVal) return alert("Please select an option or provide your own answer.");
            answerVal = otherVal ? otherVal : checked.value;
        } else if (type === 'multi-select') {
            const checked = document.querySelectorAll('input[name="answer"]:checked');
            const otherVal = document.getElementById('otherAns')?.value.trim();
            if (checked.length === 0 && !otherVal) return alert("Please select at least one option or provide your own answer.");
            
            const selectedVals = Array.from(checked).map(c => c.value);
            if (otherVal) selectedVals.push(otherVal);
            answerVal = selectedVals.join(', ');
        } else if (type === 'slider') {
            answerVal = document.getElementById('slideVal').value;
        } else {
            const textEl = document.getElementById('textAns');
            if (!textEl.value.trim()) return alert("Please provide an answer.");
            answerVal = textEl.value.trim();
        }

        showLoader();
        const payload = {
            sessionId: currentSessionId,
            question: currentQuestionData.question,
            answer: answerVal,
            type: type
        };

        const res = await apiFetch('/api/session/answer', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        
        if (res) handleGroqResponse(res);
    }

    function handleGroqResponse(data) {
        if (data.done) {
            // Assessment is complete, trigger ranking
            finishSession(currentSessionId);
            return;
        }

        currentSessionId = data.sessionId;
        questionHistory.push(data);
        questionCount = questionHistory.length;
        renderQuestion(data);
    }
    
    async function goPrevious() {
        if (questionHistory.length <= 1) return;
        
        // Remove current question
        questionHistory.pop();
        
        // Load the previous question
        const prevData = questionHistory[questionHistory.length - 1];
        questionCount = questionHistory.length;
        
        showLoader();
        try {
            await apiFetch('/api/session/undo_last', {
                method: 'POST',
                body: JSON.stringify({ sessionId: currentSessionId })
            });
        } catch (e) {
            console.error('Failed to undo last question');
        }
        
        renderQuestion(prevData);
    }

    function renderQuestion(data) {
        currentQuestionData = data;
        document.getElementById('questionText').textContent = data.question;
        document.getElementById('questionContext').textContent = data.context || '';
        document.getElementById('questionCounter').textContent = `Question ${questionCount}`;
        
        const prevBtn = document.getElementById('prevBtn');
        if (questionCount > 1) {
            prevBtn.classList.remove('hidden');
        } else {
            prevBtn.classList.add('hidden');
        }
        
        const container = document.getElementById('inputContainer');
        container.innerHTML = '';
        
        if (data.type === 'single-select') {
            data.options.forEach((opt, idx) => {
                container.innerHTML += `
                    <label class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                        <input type="radio" name="answer" value="${opt}" class="text-indigo-600 w-5 h-5 mr-3">
                        <span class="text-gray-800 font-medium">${opt}</span>
                    </label>
                `;
            });
            container.innerHTML += `
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Other (please specify):</label>
                    <input type="text" id="otherAns" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type your answer...">
                </div>
            `;
        } else if (data.type === 'multi-select') {
            data.options.forEach((opt, idx) => {
                container.innerHTML += `
                    <label class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                        <input type="checkbox" name="answer" value="${opt}" class="text-indigo-600 rounded w-5 h-5 mr-3">
                        <span class="text-gray-800 font-medium">${opt}</span>
                    </label>
                `;
            });
            container.innerHTML += `
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Other (please specify):</label>
                    <input type="text" id="otherAns" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type your answer...">
                </div>
            `;
        } else if (data.type === 'slider') {
            container.innerHTML = `
                <div class="px-2 pt-6">
                    <input type="range" id="slideVal" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <div class="flex justify-between mt-2 text-xs text-gray-500 font-bold">
                        <span>1 (Strongly Disagree / Low)</span>
                        <span>10 (Strongly Agree / High)</span>
                    </div>
                    <div class="text-center font-bold text-2xl text-indigo-600 mt-4" id="slOut">5</div>
                </div>
            `;
            setTimeout(() => {
                const s = document.getElementById('slideVal');
                s.oninput = () => document.getElementById('slOut').innerText = s.value;
            }, 50);
        } else {
            container.innerHTML = `
                <textarea id="textAns" rows="4" placeholder="Type your answer here..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            `;
        }

        hideLoader();
    }

    document.getElementById('questionForm').addEventListener('submit', submitAnswer);

    function finishSession(sessionId) {
        // redirect to loading and pass session id for ranking
        localStorage.setItem('activeSessionId', sessionId);
        window.location.href = '/loading';
    }
</script>
{% endblock %}
