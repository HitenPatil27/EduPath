{% extends "base.html" %}

{% block content %}
<section class="gradient-bg py-20 text-white relative overflow-hidden">
    <div class="absolute top-0 right-0 w-96 h-96 bg-white/10 rounded-full blur-[100px]"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
        <span class="inline-block px-4 py-1 rounded-full bg-white/20 border border-white/30 text-xs font-bold uppercase tracking-widest mb-6">Analysis Complete</span>
        <h1 class="text-5xl font-extrabold mb-6 tracking-tight">Your Career <span class="text-white bg-indigo-600/30 px-3 rounded-xl italic">Blueprint</span></h1>
        <p class="text-xl opacity-90 max-w-2xl mx-auto">We've mapped your unique attributes against 10,000+ career trajectories. Here are your top matches.</p>
    </div>
</section>

<section class="py-16 bg-slate-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Top 3 Recommendations -->
        <div class="flex items-center gap-4 mb-10">
            <h2 class="text-3xl font-bold text-gray-900 italic">Preferred Paths</h2>
            <div class="h-[1px] bg-indigo-100 flex-grow"></div>
        </div>

        <div id="top3-container" class="grid md:grid-cols-3 gap-8 mb-16">
            <!-- Rendered via JS -->
            <div class="col-span-3 text-center py-24">
                <div class="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-400 font-bold italic">Assembling your results...</p>
            </div>
        </div>

        <!-- All Other Recommendations -->
        <div class="glass rounded-3xl overflow-hidden border border-white/80 shadow-xl">
            <button onclick="toggleAll()" class="w-full flex justify-between items-center p-8 text-2xl font-bold text-gray-900 hover:bg-white/50 focus:outline-none transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-600">
                        <i class="fas fa-list-ul"></i>
                    </div>
                    <span class="italic">Alternative Recommendations</span>
                </div>
                <i id="toggleIcon" class="fas fa-chevron-down text-gray-400 group-hover:text-indigo-600 transition-colors"></i>
            </button>
            <div id="all-container" class="hidden p-8 border-t border-gray-100/50 space-y-4 bg-white/60">
                <!-- Rendered via JS -->
            </div>
        </div>

        <div class="mt-20 flex flex-col md:flex-row items-center justify-center gap-6">
            <button onclick="retakeQuiz()" class="btn-primary px-10 py-4 text-lg">
                <i class="fas fa-redo mr-2"></i> Retake Assessment
            </button>
            <button onclick="window.print()" class="px-10 py-4 rounded-2xl bg-white border border-gray-200 text-gray-700 font-bold hover:bg-gray-50 transition-all flex items-center gap-2">
                <i class="fas fa-download"></i> Download Report
            </button>
        </div>

    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    window.addEventListener('DOMContentLoaded', async () => {
        if (!getUser()) window.location.href = '/';
        const sessionId = localStorage.getItem('activeSessionId');
        if (!sessionId) {
            window.location.href = '/history';
            return;
        }

        const data = await apiFetch(`/api/session/${sessionId}`);
        if (data && data.recommendations) {
            renderResults(data.recommendations);
        }
    });

    function renderResults(recs) {
        const top3 = document.getElementById('top3-container');
        const allList = document.getElementById('all-container');
        top3.innerHTML = '';
        allList.innerHTML = '';

        recs.forEach((rec, idx) => {
            if (idx < 3) {
                // Top 3 card - GLASSMORPHIC
                let rankLabel = idx === 0 ? 'Primary Match' : idx === 1 ? 'Secondary Path' : 'Specialization';
                let rankColor = idx === 0 ? 'bg-indigo-600' : idx === 1 ? 'bg-purple-600' : 'bg-pink-600';
                let strokeColor = rec.matchScore > 85 ? '#6366f1' : '#a855f7';
                let dashOffset = 100 - rec.matchScore;

                top3.innerHTML += `
                    <div class="glass border border-white/80 rounded-[2.5rem] shadow-2xl overflow-hidden card-hover fade-in flex flex-col h-full bg-white/70" style="animation-delay: ${idx * 0.2}s">
                        <div class="h-2 bg-gradient-to-right flex">
                             <div class="${rankColor} w-full h-full"></div>
                        </div>
                        <div class="p-8 flex-grow">
                            <div class="flex justify-between items-start mb-6">
                                <span class="px-3 py-1 rounded-full text-[10px] uppercase font-black tracking-widest text-white ${rankColor}">
                                    ${rankLabel}
                                </span>
                                
                                <div class="relative w-14 h-14">
                                    <svg class="w-full h-full rotate-[-90deg]" viewBox="0 0 36 36">
                                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#f1f5f9" stroke-width="4" />
                                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${strokeColor}" stroke-width="4" stroke-dasharray="100, 100" stroke-dashoffset="100" class="score-ring transition-all duration-1000 ease-out" data-score="${dashOffset}"/>
                                    </svg>
                                    <div class="absolute inset-0 flex items-center justify-center text-xs font-black text-gray-800">${rec.matchScore}%</div>
                                </div>
                            </div>
                            
                            <h3 class="text-2xl font-black text-gray-900 mb-3 leading-tight tracking-tight italic">${rec.title}</h3>
                            <p class="text-gray-500 text-sm mb-6 leading-relaxed italic">${rec.description}</p>
                            
                            <div class="bg-indigo-50/50 rounded-2xl p-4 mb-6 relative group overflow-hidden">
                                <i class="fas fa-quote-left absolute -top-1 -left-1 text-indigo-100 text-3xl opacity-50"></i>
                                <p class="text-sm font-semibold italic text-indigo-900 relative z-10">
                                    ${rec.whyItFitsYou}
                                </p>
                            </div>
                            
                            <div class="flex flex-wrap gap-2">
                                ${(rec.skills || []).slice(0, 4).map(s => `<span class="bg-white/80 text-gray-600 text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg border border-gray-100">${s}</span>`).join('')}
                            </div>
                        </div>
                        
                        <div class="bg-white/50 p-6 border-t border-gray-100/50 flex justify-between items-center mt-auto">
                            ${rec.salaryRange !== 'N/A' ? `
                            <div>
                                <span class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Potential</span>
                                <span class="font-bold text-gray-800 italic">${rec.salaryRange}</span>
                            </div>` : '<div></div>'}
                            ${rec.growthOutlook !== 'N/A' ? `
                            <div class="text-right">
                                <span class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Market</span>
                                <span class="font-bold text-green-600 italic">${rec.growthOutlook} Growth</span>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            } else {
                // All list - Compact list items
                let matchColor = rec.matchScore > 85 ? 'text-indigo-600' : 'text-purple-600';
                allList.innerHTML += `
                    <div class="bg-white/80 border border-gray-100 rounded-2xl p-6 flex flex-col md:flex-row gap-6 items-center card-hover transition-all">
                        <div class="flex-shrink-0 text-center w-20">
                            <div class="text-xs font-black text-gray-300 uppercase italic">Rank</div>
                            <div class="text-4xl font-black text-gray-200">#${rec.rank}</div>
                        </div>
                        <div class="flex-grow">
                            <div class="flex items-center gap-3 mb-1">
                                <h4 class="text-xl font-bold text-gray-900 italic">${rec.title}</h4>
                                <span class="text-sm font-black ${matchColor}">${rec.matchScore}% Fit</span>
                            </div>
                            <p class="text-sm text-gray-500 italic max-w-2xl">${rec.description}</p>
                        </div>
                        <div class="flex-shrink-0 flex gap-4 text-xs font-bold italic">
                            ${rec.salaryRange !== 'N/A' ? `<div class="bg-indigo-50 px-4 py-2 rounded-xl text-indigo-600">${rec.salaryRange}</div>` : ''}
                            ${rec.growthOutlook !== 'N/A' ? `<div class="bg-green-50 px-4 py-2 rounded-xl text-green-600">${rec.growthOutlook}</div>` : ''}
                        </div>
                    </div>
                `;
            }
        });
        
        // Trigger progress ring animations
        setTimeout(() => {
            document.querySelectorAll('.score-ring').forEach(ring => {
                ring.style.strokeDashoffset = ring.dataset.score;
            });
        }, 300);
    }

    function toggleAll() {
        const container = document.getElementById('all-container');
        const icon = document.getElementById('toggleIcon');
        container.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
    }

    function retakeQuiz() {
        localStorage.removeItem('activeSessionId');
        window.location.href = '/questionnaire';
    }
</script>

<style>
    @media print {
        nav, footer, .btn-primary, .px-10, #toggleIcon { display: none !important; }
        .glass { background: white !important; border: 1px solid #eee !important; }
        body { background: white !important; }
        #all-container { display: block !important; }
    }
</style>
{% endblock %}
